<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MedSafe-AI | Human OCR Review</title><style>body{font:16px system-ui;background:#f4f7fb;color:#182334;max-width:850px;margin:35px auto;padding:20px}main{background:white;padding:28px;border-radius:16px;box-shadow:0 5px 25px #18315218}textarea{width:100%;box-sizing:border-box;min-height:210px;padding:14px;font:15px monospace}button{background:#144b79;color:white;border:0;border-radius:7px;padding:12px 18px;cursor:pointer}pre{white-space:pre-wrap;background:#f0f3f7;padding:15px;overflow-wrap:anywhere}label{display:block;margin:14px 0}.warn{color:#923d00}</style><main><h1>MedSafe-AI — OCR Human Review</h1><p class="warn">Research prototype. OCR suggestions are unverified. This tool never clears a prescription for dispensing.</p><label>Load Notebook 60 handoff JSON: <input id="file" type="file" accept=".json,application/json"></label><p id="state"></p><label>Corrected prescription transcription<textarea id="text" placeholder="Load a review JSON and correct every medicine, dose, age, and frequency before submitting."></textarea></label><label><input id="confirm" type="checkbox"> I have manually checked the transcription against the source image.</label><button id="submit">Submit for research checks</button><h2>Research findings</h2><pre id="result">No review submitted.</pre></main><script>const el=id=>document.getElementById(id);el('file').onchange=async e=>{try{const raw=JSON.parse(await e.target.files[0].text());const r=await fetch('/api/review/import',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(raw)});const x=await r.json();if(!r.ok)throw Error(JSON.stringify(x));el('text').value=x.transcription_for_review;el('state').textContent='Loaded '+x.regions.length+' unverified OCR regions. Correct the text manually.';el('confirm').checked=false;}catch(err){el('state').textContent='Import error: '+err.message}};el('submit').onclick=async()=>{if(!el('confirm').checked){el('result').textContent='Please review the image and confirm transcription first.';return}try{const r=await fetch('/api/review/submit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({corrected_transcription:el('text').value,reviewer_confirmed:true})});el('result').textContent=JSON.stringify(await r.json(),null,2)}catch(e){el('result').textContent=String(e)}};</script></html>
